<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1>Interactive Image Gallery</h1>
        <p>Explore beautiful moments</p>
    </header>

    <main class="container">
        <section class="gallery-section" aria-label="Photo gallery">
            <div class="section-heading">
                <h2>My Gallery</h2>
                <p>Click any image to open the slideshow. Use Previous, Next, or auto-play to browse.</p>
            </div>

            <div class="gallery-grid" id="galleryGrid">
                <button class="gallery-item" data-index="0" aria-label="Open mountain landscape">
                    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=85" alt="Mountain landscape" loading="lazy">
                    <span>Mountain Escape</span>
                </button>
                <button class="gallery-item" data-index="1" aria-label="Open ocean waves">
                    <img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=900&q=85" alt="Ocean waves" loading="lazy">
                    <span>Ocean Waves</span>
                </button>
                <button class="gallery-item" data-index="2" aria-label="Open forest">
                    <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=900&q=85" alt="Sunlight in a green forest" loading="lazy">
                    <span>Green Forest</span>
                </button>
                <button class="gallery-item" data-index="3" aria-label="Open flower">
                    <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=900&q=85" alt="Colorful flowers" loading="lazy">
                    <span>Flower Garden</span>
                </button>
                <button class="gallery-item" data-index="4" aria-label="Open city skyline">
                    <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=900&q=85" alt="City skyline at dusk" loading="lazy">
                    <span>City Lights</span>
                </button>
                <button class="gallery-item" data-index="5" aria-label="Open desert">
                    <img src="https://images.unsplash.com/photo-1509316785289-025f5b846b35?auto=format&fit=crop&w=900&q=85" alt="Golden desert dunes" loading="lazy">
                    <span>Golden Desert</span>
                </button>
                <button class="gallery-item" data-index="6" aria-label="Open lake">
                    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=85" alt="Peaceful lake and mountains" loading="lazy">
                    <span>Quiet Lake</span>
                </button>
                <button class="gallery-item" data-index="7" aria-label="Open night sky">
                    <img src="https://images.unsplash.com/photo-1475274047050-1d0c0975c63e?auto=format&fit=crop&w=900&q=85" alt="Starry night sky" loading="lazy">
                    <span>Starry Night</span>
                </button>
            </div>
        </section>
    </main>

    <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Image slideshow">
        <button class="close-btn" id="closeBtn" aria-label="Close slideshow">&times;</button>
        <button class="slide-btn prev-btn" id="prevBtn" aria-label="Previous image">&#10094;</button>
        <figure class="slide-figure">
            <img id="slideImage" src="" alt="">
            <figcaption id="slideCaption"></figcaption>
        </figure>
        <button class="slide-btn next-btn" id="nextBtn" aria-label="Next image">&#10095;</button>
        <div class="slide-controls">
            <button id="playBtn" class="control-btn">▶ Start auto-play</button>
            <span id="slideCount">1 / 8</span>
            <span class="keyboard-hint">Tip: use ← / → keys, or Esc to close.</span>
        </div>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 Interactive Image Gallery. All rights reserved.</p>
    </footer>
</body>
</html>
