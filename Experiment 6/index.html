
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Product Catalogue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Product Catalogue</h1>

    <!-- Search Bar --> <!-- ivide id koduthath javascript inu vendi aan. -->
    <input type="text" id="search" placeholder="Search products...">
<!--  type koduthath text aan avide adikka enn arriyan.|placeholder vechone user nu hint kodukkkan search  product. -->
    <!-- Category Filter -->
     <!-- select indakkanath oru drop down veran aan!. -->
    <select id="category">
        <!-- ivide value="All" okke vechonath javascript nu edukkan aan. -->
        <option value="All">All Categories</option>
        <option value="Electronics">Electronics</option>
        <option value="Clothing">Clothing</option>
        <option value="Books">Books</option>
    </select>

    <!-- Product List -->
    <div id="productList"></div>

    <script src="script.js"></script>

</body>
</html>
